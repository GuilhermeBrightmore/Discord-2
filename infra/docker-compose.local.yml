services:
  livekit:
    image: livekit/livekit-server:v1.9.8
    container_name: discord2-livekit
    command: ["--config", "/etc/livekit.yaml"]
    restart: unless-stopped
    volumes:
      - ./livekit.local.runtime.yaml:/etc/livekit.yaml:ro
    ports:
      - "0.0.0.0:7880:7880/tcp"
      - "0.0.0.0:7881:7881/tcp"
      - "0.0.0.0:7882:7882/udp"
